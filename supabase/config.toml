# Supabase local CLI target — STAGING only.
# Production must not be linked from this file.
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "ydlwukjzqtssbzirnefs"

[api]
enabled = true
port = 54321
schemas = ["public", "archive"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.migrations]
# Phase SQL lives in orbit-phase1/2/3; optional copies go in ./migrations/

# Hosted: Dashboard → Authentication → Hooks still required (see docs/AUTH_TENANT_HOOK_DEPLOY.md).
# Function created by supabase/migrations/20260814000000_phase_3e_auth_tenant_jwt_hook.sql
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[functions.parent_zone1_im_here]
verify_jwt = true

[functions.telemetry-ingress]
verify_jwt = true
